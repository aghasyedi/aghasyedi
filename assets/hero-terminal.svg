<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Animated terminal hero">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00FFD1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect x="20" y="20" width="960" height="300" rx="18" fill="url(#win)" stroke="#2a3350" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M20 38 a18 18 0 0 1 18 -18 h924 a18 18 0 0 1 18 18 v22 h-960 z" fill="#11182a"/>
  <circle cx="48" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="72" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="36" r="7" fill="#27c93f"/>
  <text x="500" y="41" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b97b5">agha@quantum — zsh — 120x40</text>

  <!-- boot lines (sequential reveal) -->
  <g font-family="monospace" font-size="19" fill="#cfe9ff">
    <text x="48" y="92" opacity="0">agha@quantum:~$ whoami<animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/></text>
    <text x="48" y="128" opacity="0" fill="#9fe7ff">&gt; Agha Tasheer Syedi — M.Tech Quantum Computing<animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.4s" fill="freeze"/></text>
    <text x="48" y="164" opacity="0" fill="#9fe7ff">&gt; DIAT–DRDO · Quantum Comm &amp; Sensing<animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.4s" fill="freeze"/></text>
    <text x="48" y="200" opacity="0" fill="#9fe7ff">&gt; focus: QKD · quantum networking · PQC<animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.4s" fill="freeze"/></text>
    <text x="48" y="236" opacity="0" fill="#9fe7ff">&gt; status: building decoy-state BB84 …<animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.4s" fill="freeze"/></text>
    <text x="48" y="272" fill="#7CFFB2">agha@quantum:~$<animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.3s" fill="freeze"/>
      <tspan fill="#ffffff">█</tspan>
      <animate attributeName="opacity" values="1;0.2;1" begin="4.5s" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- spinning atom top-right -->
  <g transform="translate(880,250)">
    <g transform="rotate(0)"><g><ellipse rx="60" ry="20" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.8"/><circle cx="60" cy="0" r="4" fill="#00FFD1"/></g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></g>
    <g transform="rotate(60)"><g><ellipse rx="60" ry="20" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.8"/><circle cx="60" cy="0" r="4" fill="#b388ff"/></g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6.5s" repeatCount="indefinite"/></g>
    <g transform="rotate(120)"><g><ellipse rx="60" ry="20" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.8"/><circle cx="60" cy="0" r="4" fill="#ff4f9a"/></g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7.5s" repeatCount="indefinite"/></g>
    <circle r="6" fill="#fff"/>
  </g>
</svg>
