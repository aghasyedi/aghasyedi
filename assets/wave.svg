<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" preserveAspectRatio="none" role="img" aria-label="Animated wave divider">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00FFD1"/>
    </linearGradient>
  </defs>
  <path fill="url(#w1)" opacity="0.35" d="M0,50 C200,10 400,90 600,50 C800,10 1000,90 1200,50 L1200,90 L0,90 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0;-120,0;0,0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#00FFD1" opacity="0.25" d="M0,60 C250,20 450,100 600,60 C750,20 950,100 1200,60 L1200,90 L0,90 Z">
    <animateTransform attributeName="transform" type="translate" values="-120,0;0,0;-120,0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path fill="none" stroke="#b388ff" stroke-width="2" opacity="0.6" d="M0,45 C200,5 400,85 600,45 C800,5 1000,85 1200,45">
    <animateTransform attributeName="transform" type="translate" values="0,0;-120,0;0,0" dur="9s" repeatCount="indefinite"/>
  </path>
</svg>
