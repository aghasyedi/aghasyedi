<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Competency radar">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#350c3b"/>
      <stop offset="100%" stop-color="#1d0620"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9830A0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C86FD0" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="540" fill="url(#rbg)"/>
  <text x="500" y="44" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" letter-spacing="5" fill="#FFFFFF" opacity="0.9">COMPETENCY RADAR</text>

  <g transform="translate(500,290)">
    <!-- grid rings -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1">
      <polygon points="0,-55 47.6,-27.5 47.6,27.5 0,55 -47.6,27.5 -47.6,-27.5" opacity="0.14"/>
      <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5" opacity="0.14"/>
      <polygon points="0,-155 134.2,-77.5 134.2,77.5 0,155 -134.2,77.5 -134.2,-77.5" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="-155" opacity="0.18"/>
      <line x1="0" y1="0" x2="134.2" y2="-77.5" opacity="0.18"/>
      <line x1="0" y1="0" x2="134.2" y2="77.5" opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="155" opacity="0.18"/>
      <line x1="0" y1="0" x2="-134.2" y2="77.5" opacity="0.18"/>
      <line x1="0" y1="0" x2="-134.2" y2="-77.5" opacity="0.18"/>
    </g>

    <!-- data -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.92;1.04;0.92" dur="5.5s" repeatCount="indefinite"/>
      <polygon points="0,-136 131.6,-76 124.7,72 0,120 -110.9,64 -97,-56" fill="url(#fill)" stroke="#FFFFFF" stroke-width="2.4">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" repeatCount="indefinite"/>
      </polygon>
      <g fill="#FFFFFF">
        <circle cx="0" cy="-136" r="4.5"/>
        <circle cx="131.6" cy="-76" r="4.5"/>
        <circle cx="124.7" cy="72" r="4.5"/>
        <circle cx="0" cy="120" r="4.5"/>
        <circle cx="-110.9" cy="64" r="4.5"/>
        <circle cx="-97" cy="-56" r="4.5"/>
      </g>
    </g>
  </g>

  <!-- axis labels -->
  <g font-family="'JetBrains Mono',monospace" font-size="14" fill="#F3D9F6">
    <text x="500" y="108" text-anchor="middle">Quantum Algorithms</text>
    <text x="690" y="196" text-anchor="start">QKD &amp; Crypto</text>
    <text x="690" y="404" text-anchor="start">Python</text>
    <text x="500" y="512" text-anchor="middle">Web / Flask</text>
    <text x="310" y="404" text-anchor="end">Scientific Computing</text>
    <text x="310" y="196" text-anchor="end">Quantum Sensing</text>
  </g>
</svg>
