<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Animated quantum circuit">
  <defs>
    <linearGradient id="cw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00FFD1"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00FFD1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00FFD1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="#0a0a1a"/>

  <!-- qubit wires -->
  <g stroke="url(#cw)" stroke-width="2" opacity="0.55">
    <line x1="60" y1="50" x2="1140" y2="50"/>
    <line x1="60" y1="90" x2="1140" y2="90"/>
    <line x1="60" y1="130" x2="1140" y2="130"/>
    <line x1="60" y1="170" x2="1140" y2="170"/>
  </g>

  <!-- gate labels -->
  <g font-family="monospace" font-size="13" fill="#cfe9ff" opacity="0.85">
    <text x="60" y="34">q0</text>
    <text x="60" y="74">q1</text>
    <text x="60" y="114">q2</text>
    <text x="60" y="154">q3</text>
  </g>

  <!-- gates -->
  <g font-family="monospace" font-size="14" font-weight="700">
    <rect x="180" y="36" width="28" height="28" rx="5" fill="#1b1140" stroke="#7F00FF"/>
    <text x="194" y="55" text-anchor="middle" fill="#b388ff">H</text>
    <rect x="360" y="76" width="28" height="28" rx="5" fill="#10262a" stroke="#00FFD1"/>
    <text x="374" y="95" text-anchor="middle" fill="#5cffe0">X</text>
    <circle cx="540" cy="90" r="14" fill="none" stroke="#ff4f9a" stroke-width="2.5"/>
    <circle cx="540" cy="50" r="14" fill="none" stroke="#ff4f9a" stroke-width="2.5"/>
    <line x1="540" y1="64" x2="540" y2="76" stroke="#ff4f9a" stroke-width="2.5"/>
    <rect x="720" y="116" width="28" height="28" rx="5" fill="#1b1140" stroke="#7F00FF"/>
    <text x="734" y="135" text-anchor="middle" fill="#b388ff">Z</text>
    <rect x="900" y="156" width="28" height="28" rx="5" fill="#10262a" stroke="#00FFD1"/>
    <text x="914" y="175" text-anchor="middle" fill="#5cffe0">M</text>
  </g>

  <!-- gate blink sequence -->
  <g fill="#ffffff">
    <rect x="180" y="36" width="28" height="28" rx="5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="76" width="28" height="28" rx="5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="720" y="116" width="28" height="28" rx="5" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="156" width="28" height="28" rx="5" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- travelling pulse -->
  <circle r="16" fill="url(#pulse)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M194,50 L374,90 L540,90 L734,130 L914,170 L1140,170"/>
  </circle>
  <circle r="5" fill="#ffffff">
    <animateMotion dur="4s" repeatCount="indefinite" path="M194,50 L374,90 L540,90 L734,130 L914,170 L1140,170"/>
  </circle>
</svg>
