      <circle cx="150" cy="100" r="8" fill="#9830A0" stroke="#FFFFFF" stroke-width="2"><animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="182" y="96" fill="#E9C6EE" font-weight="700">2021</text>
      <text x="182" y="116">B.Tech CSE · SHUATS, Prayagraj</text>
    </g>
    <g>
      <circle cx="150" cy="180" r="8" fill="#9830A0" stroke="#FFFFFF" stroke-width="2"><animate attributeName="r" values="8;11;8" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="182" y="176" fill="#E9C6EE" font-weight="700">2025</text>
      <text x="182" y="196">B.Tech graduate · GATE Qualified (CS)</text>
    </g>
    <g>
      <circle cx="150" cy="260" r="8" fill="#9830A0" stroke="#FFFFFF" stroke-width="2"><animate attributeName="r" values="8;11;8" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="182" y="256" fill="#E9C6EE" font-weight="700">2025–27</text>
