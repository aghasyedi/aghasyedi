<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Decoy-state BB84 QKD pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d0620"/>
      <stop offset="100%" stop-color="#350c3b"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9830A0"/>
      <stop offset="100%" stop-color="#C86FD0"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#C86FD0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C86FD0" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C86FD0"/>
    </marker>
  </defs>

  <rect width="1100" height="300" fill="url(#pbg)"/>
  <text x="550" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="15" letter-spacing="4" fill="#FFFFFF" opacity="0.9">DECOY-STATE BB84 · QKD PIPELINE</text>

  <!-- connectors -->
  <g stroke="url(#arrow)" stroke-width="2" marker-end="url(#ah)">
    <line x1="262" y1="150" x2="294" y2="150"/>
    <line x1="537" y1="150" x2="569" y2="150"/>
    <line x1="812" y1="150" x2="844" y2="150"/>
  </g>

  <!-- travelling photon -->
  <circle r="14" fill="url(#dot)"><animateMotion dur="6s" repeatCount="indefinite" path="M262,150 L844,150"/></circle>
  <circle r="4" fill="#FFFFFF"><animateMotion dur="6s" repeatCount="indefinite" path="M262,150 L844,150"/></circle>

  <!-- cards -->
  <g font-family="'JetBrains Mono',monospace">
    <!-- 01 -->
    <rect x="25" y="95" width="237" height="110" rx="14" fill="#2a0a2f" stroke="#9830A0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="122" r="13" fill="#9830A0"/>
    <text x="52" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">01</text>
    <text x="76" y="127" font-size="14" font-weight="700" fill="#FFFFFF">PREPARE</text>
    <text x="45" y="158" font-size="11" fill="#E9C6EE">Photon source</text>
    <text x="45" y="178" font-size="11" fill="#E9C6EE">Polarisation encoding</text>

    <!-- 02 -->
    <rect x="300" y="95" width="237" height="110" rx="14" fill="#2a0a2f" stroke="#9830A0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="327" cy="122" r="13" fill="#9830A0"/>
    <text x="327" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">02</text>
    <text x="351" y="127" font-size="14" font-weight="700" fill="#FFFFFF">TRANSMIT</text>
    <text x="320" y="158" font-size="11" fill="#E9C6EE">Quantum channel</text>
    <text x="320" y="178" font-size="11" fill="#E9C6EE">Attenuation &amp; loss</text>

    <!-- 03 -->
    <rect x="575" y="95" width="237" height="110" rx="14" fill="#2a0a2f" stroke="#9830A0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="602" cy="122" r="13" fill="#9830A0"/>
    <text x="602" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">03</text>
    <text x="626" y="127" font-size="14" font-weight="700" fill="#FFFFFF">MEASURE</text>
    <text x="595" y="158" font-size="11" fill="#E9C6EE">Single-photon detectors</text>
    <text x="595" y="178" font-size="11" fill="#E9C6EE">Basis sifting</text>

    <!-- 04 -->
    <rect x="850" y="95" width="235" height="110" rx="14" fill="#2a0a2f" stroke="#C86FD0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="877" cy="122" r="13" fill="#C86FD0"/>
    <text x="877" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#350C3B">04</text>
    <text x="901" y="127" font-size="14" font-weight="700" fill="#FFFFFF">SECURE</text>
    <text x="870" y="158" font-size="11" fill="#E9C6EE">QBER · privacy amp.</text>
    <text x="870" y="178" font-size="11" fill="#E9C6EE">Final secure key</text>
  </g>
</svg>
